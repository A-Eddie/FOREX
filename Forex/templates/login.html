{% extends "base.html" %}
{% block title %} — Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-4">

    <div class="text-center mb-4">
      <i class="bi bi-graph-up-arrow text-success" style="font-size:2.5rem"></i>
      <h4 class="mt-2 text-white fw-bold">Forex AI Platform</h4>
      <p class="text-secondary small">Sign in to your trading account</p>
    </div>

    <div class="card">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

          <div class="mb-3">
            <label class="form-label text-secondary small">Username</label>
            <input type="text" name="username" class="form-control"
                   placeholder="your_username" autofocus required>
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small">Password</label>
            <input type="password" name="password" class="form-control"
                   placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-success w-100 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-secondary small mt-3">
      Don't have an account?
      <a href="{{ url_for('register') }}" class="text-success">Create one</a>
    </p>

  </div>
</div>
{% endblock %}
